name: BubbiFeed iOS simulator
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bubbifeed-ios-simulator
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out the acceptance tools
        uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - name: Check out the app at the selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install app dependencies and simulator CLI
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm install --global eas-cli@27.11.0 --no-audit --no-fund
      - name: Verify Expo authentication and simulator entitlement
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN is missing"; exit 1; }
          eas simulator:availability --json > "$RUNNER_TEMP/availability.json"
          jq '{accountName,available}' "$RUNNER_TEMP/availability.json"
          jq -e --arg account "$(jq -r .expo.owner app.json)" \
            '.available == true and .accountName == $account' "$RUNNER_TEMP/availability.json"
      - name: Find or build the exact iOS Simulator binary
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_SKIP_LOCKFILE_CHECK: '1'
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "App commit: $sha"
          eas build:list --platform ios --simulator --build-profile preview --git-commit-hash "$sha" \
            --status finished --limit 5 --non-interactive --json > "$RUNNER_TEMP/builds.json"
          id=$(jq -r '[.[] | select(.artifacts.buildUrl != null and (.expirationDate == null or .expirationDate > (now | todate)))] | first.id // empty' "$RUNNER_TEMP/builds.json")
          if [[ -z "$id" ]]; then
            eas build --platform ios --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/builds.json"
            id=$(jq -er --arg sha "$sha" '.[] | select(.status == "FINISHED" and .gitCommitHash == $sha) | .id' "$RUNNER_TEMP/builds.json")
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Source: \`$sha\` · iOS Simulator build: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Appium client
        run: python -m pip install Appium-Python-Client==6.1.8
      - name: Start one iOS simulator
        id: simulator
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          set -euo pipefail
          umask 077
          eas simulator:start --platform ios --type appium --build-id "$BUILD_ID" \
            --name "BubbiFeed iOS $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --max-duration-minutes 7 \
            --max-idle-time-minutes 5 --non-interactive > "$RUNNER_TEMP/simulator-start.log" 2>&1
          test -s .env.eas-simulator
          eas simulator:get --json | jq '{id,name,platform,status,deviceRunSessionUrl}'
      - name: Verify native feeding flows
        timeout-minutes: 12
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/ios-evidence
        run: eas simulator:exec python ../qa/tests/ios/feeding.py
      - name: Stop the simulator
        if: always() && steps.simulator.outcome != 'skipped'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          name="BubbiFeed iOS $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          eas simulator:list --platform ios --name "$name" --limit 5 --json > "$RUNNER_TEMP/session-list.json"
          id=$(jq -r --arg name "$name" '.sessions[] | select(.name == $name) | .id' "$RUNNER_TEMP/session-list.json")
          if [[ -n "$id" ]]; then
            eas simulator:stop --id "$id" --non-interactive --json | jq '{id,status}'
            mkdir -p "$RUNNER_TEMP/ios-evidence"
            eas simulator:get --id "$id" --json | jq '{id,platform,status,startedAt,finishedAt,deviceRunSessionUrl}' \
              | tee "$RUNNER_TEMP/ios-evidence/session.json"
          elif [[ -s .env.eas-simulator ]]; then
            eas simulator:stop --non-interactive --json | jq '{id,status}'
          fi
      - name: Upload test evidence
        if: always() && steps.simulator.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence
          path: ${{ runner.temp }}/ios-evidence
          if-no-files-found: warn
          retention-days: 14
